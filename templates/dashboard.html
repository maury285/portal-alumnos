<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte Académico</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .dashboard-container { max-width: 600px; margin: 0 auto; background-color: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; margin-bottom: 5px; }
        .resumen { background-color: #e9f5ff; padding: 20px; border-left: 5px solid #2196F3; margin: 30px 0; line-height: 1.6; border-radius: 4px; font-size: 16px;}
        .logout-btn { display: block; background-color: #f44336; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; text-align: center; font-weight: bold;}
        .logout-btn:hover { background-color: #d32f2f; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Reporte de {{ alumno['nombre'] }}</h1>
        <p style="text-align: center; color: #666; margin-top: 0;"><strong>DNI:</strong> {{ alumno['dni'] }}</p>
        
        <div class="resumen">
            <!-- Esto toma el texto de Gemini y respeta los párrafos -->
            {{ resumen | replace('\n', '<br>') | safe }}
        </div>
        
        <a href="{{ url_for('logout') }}" class="logout-btn">Cerrar Sesión</a>
    </div>
</body>
</html>
